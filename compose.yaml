name: crowdsec

x-daemonless:
  title: "CrowdSec"
  icon: ":material-shield-lock:"
  category: "Infrastructure"
  description: "Open-source collaborative intrusion detection and prevention engine (IDS/IPS and AppSec WAF) with crowdsourced threat intelligence."
  upstream_url: "https://github.com/crowdsecurity/crowdsec"
  web_url: "https://www.crowdsec.net/"
  freshports_url: "https://www.freshports.org/security/crowdsec/"
  user: "bsd"
  mlock: false
  appjail: true
  community: "Discord:https://discord.gg/Kb9tkhecZT"

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      COLLECTIONS:
        desc: "Space-separated CrowdSec Hub collections to install on startup (for example crowdsecurity/caddy crowdsecurity/nginx)"
        optional: true
        level: primary
      PARSERS:
        desc: "Space-separated CrowdSec Hub parsers to install on startup"
        optional: true
        level: options
      SCENARIOS:
        desc: "Space-separated CrowdSec Hub scenarios to install on startup"
        optional: true
        level: options
      ENROLL_KEY:
        desc: "CrowdSec Console enrollment key"
        type: secret
        optional: true
        level: options
      ENROLL_INSTANCE_NAME:
        desc: "Instance name registered in CrowdSec Console when ENROLL_KEY is set"
        optional: true
        level: options
      ENROLL_TAGS:
        desc: "Space-separated tags passed to cscli console enroll"
        optional: true
        level: advanced
      POSTOVERFLOWS:
        desc: "Space-separated CrowdSec Hub postoverflows to install on startup"
        optional: true
        level: advanced
      APPSEC_CONFIGS:
        desc: "Space-separated CrowdSec AppSec WAF configs to install on startup"
        optional: true
        level: advanced
      APPSEC_RULES:
        desc: "Space-separated CrowdSec AppSec WAF rules to install on startup"
        optional: true
        level: advanced
      DISABLE_ONLINE_API:
        desc: "Disable Central API (CAPI) registration and community blocklist pulls"
        type: boolean
        optional: true
        level: advanced
      DISABLE_AGENT:
        desc: "Run only the Local API (LAPI) and disable the log processor agent (-no-cs)"
        type: boolean
        optional: true
        level: advanced
      NO_HUB_UPGRADE:
        desc: "Skip automatic CrowdSec Hub index updates and upgrades on startup"
        type: boolean
        optional: true
        level: advanced
      CUSTOM_HOSTNAME:
        desc: "Machine name this instance registers with its Local API (default localhost)"
        optional: true
        level: advanced
      LOCAL_API_URL:
        desc: "Local API URL written to local_api_credentials.yaml for cscli and the agent (default http://127.0.0.1:8080)"
        optional: true
        level: advanced
    volumes:
      /config: "Persistent configuration (/config/etc) and database/hub data (/config/data)"
    ports:
      8080: "Local API (LAPI)"

  notes: |
    ## Storage layout and CLI

    Configuration files (`/config/etc`) and the SQLite database plus downloaded
    Hub data (`/config/data`) are persisted under `/config`. Inside the
    container, `/usr/local/etc/crowdsec`, `/etc/crowdsec`, and
    `/var/db/crowdsec/data` symlink into `/config`, so standard `cscli` commands
    work without extra flags:

    ```sh
    podman exec crowdsec cscli metrics
    podman exec crowdsec cscli decisions list
    ```

    ## Log acquisition and collections

    Mount target service logs read-only into the container, add acquisition
    definitions under `/config/etc/acquis.d/*.yaml` (or edit
    `/config/etc/acquis.yaml`), and list matching Hub collections in
    `COLLECTIONS` (for example `crowdsecurity/nginx`, `crowdsecurity/caddy`,
    or `crowdsecurity/haproxy`). For logs from another host or router (such
    as OpenWRT or HAProxy), add a `source: syslog` listener under
    `/config/etc/acquis.d/` with a `listen_port` above 1024 (the container
    does not run as root) and publish that UDP port.

    ## Bouncers and firewall remediation

    On FreeBSD or a router, a firewall bouncer
    (`security/crowdsec-firewall-bouncer`, OPNsense plugin, or OpenWRT
    firewall bouncer) connects to this container's LAPI on port `8080`.
    Reverse-proxy and application bouncers (Caddy, nginx, HAProxy,
    Cloudflare) connect to port `8080` the same way.

    Register bouncers with `cscli bouncers add <name>` or pass
    `BOUNCER_KEY_<name>=<api-key>` (or `BOUNCER_KEY_<name>_FILE=/path/to/key`)
    to auto-register on startup.

    ## Optional ports

    Publish `6060` for Prometheus `/metrics` or `7422` when enabling an AppSec
    WAF listener in `/config/etc/acquis.d/`.

services:
  crowdsec:
    image: ghcr.io/daemonless/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC

    volumes:
      - /path/to/containers/crowdsec:/config

    ports:
      - "8080:8080"
